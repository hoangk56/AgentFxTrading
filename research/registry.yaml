# Sổ đăng ký research của AgentFx, đọc bởi code app cho màn "Nghiên cứu" trên dashboard.
# Viết lúc 2026-11-01 06:07 UTC (date -u), chép từ research/JOURNAL.md, research/PROMPT.md, các báo cáo vòng trong
# research/results/portfolio/ và docs/forward-candidates.md. File kết quả thắng nếu số ở đây lệch.
#
# algorithms: mọi luật đã lên bậc DEMO trở lên, hoặc đang / từng chạy trên bot (live hay demo).
#   tier: live (đang chạy tiền thật) | demo (qua holdout bậc DEMO, đang chạy hoặc được phép chạy demo / paper)
#         | cho-kiem (bản nháp hoặc ứng viên đã đăng ký, chờ một lần xem holdout hay chờ người dùng quyết)
#         | da-loai (từng là ứng viên / bot nhưng đã dừng hoặc trượt sau đó).
#   Bậc chỉ đổi bằng cách sửa file này (kèm tier_reason và file làm căn cứ). App không tự đổi bậc.
#   forward: khoá bộ theo dõi forward (ecb_f3 | ecb_e1 | gold_levels | basis_b) hoặc null.
# tried: các họ giả thuyết đã test mà không đạt, mỗi nhánh (stream) một dòng, vòng mới nhất ở đầu.
#   Luật đã đăng ký rồi trượt holdout nằm ở algorithms (da-loai), không lặp lại ở đây.
# Sau mỗi vòng research: thêm dòng tried cho từng nhánh, thêm / sửa algorithms nếu có ứng viên mới hay bậc đổi.
# Số viết kiểu Việt Nam: dấu phẩy thập phân, dấu chấm hàng nghìn. bp = phần vạn giá; R = bội số rủi ro mỗi lệnh.
# Các kỷ: IS 2016–2021, VAL 2022–2024, HOLD 2025-01..2026-09 (luật crypto: IS 2020–2021, HOLD tới 2026-10-29).

