# Bản dễ hiểu của research/registry.yaml cho màn "Nghiên cứu" (docs/research-screen.md). Khoá = id trong registry.
# Viết lúc 2026-11-02. Mỗi số chép từ dòng research của registry (nguồn là file báo cáo ghi trong registry);
# file báo cáo thắng nếu số ở đây lệch. Ngày lấy từ tên file báo cáo, tier_reason, research/JOURNAL.md và git;
# mốc không có nguồn ghi ngày thì bỏ, không đoán.
#
#   name / what / why: tên, "làm gì", "vì sao có thể lãi", mỗi thứ một câu, không thuật ngữ.
#   unit: đơn vị của mọi mean bên dưới: R (bội số rủi ro mỗi lệnh) | bp (phần vạn giá mỗi lệnh)
#         | pct_week (% mỗi tuần) | pct_year (% mỗi năm).
#   periods: is (lúc tìm ra) / val (kiểm lần 1) / hold (kiểm cuối): {years, n, mean, t}; thiếu số thì null.
#   history: [{date, kind, text}], cũ trước; kind: find | demo | live | change | wait | out.
#   note: một câu thêm vào kết luận "Mạnh hay yếu" (tuỳ chọn).

# ---------------------------------------------------------------- tiền thật
c3-gotobi:
  name: "Gotobi: mua đô bằng yên vào ngày gotobi"
  what: "Ngày 5, 10, 15, 20, 25 và cuối tháng: mua USDJPY, EURJPY, GBPJPY từ tối hôm trước tới giờ chốt tỷ giá Tokyo sáng hôm sau, rồi bán khống thêm 2 tiếng sau giờ chốt."
  why: "Doanh nghiệp Nhật cần mua đô trước giờ chốt tỷ giá vào các ngày này nên đẩy giá đô lên; qua giờ chốt, lực mua hết và giá đô hay giảm lại."
  unit: R
  periods:
    is: {years: "2016–2021", n: null, mean: 0.043, t: 5.4}
    val: {years: "2022–2024", n: null, mean: 0.041, t: 3.7}
    hold: {years: "2025–2026", n: 738, mean: 0.042, t: 2.9}
  history:
    - {date: 2026-09-27, kind: find, text: "Tìm ra ở vòng Swing v2"}
    - {date: 2026-09-30, kind: live, text: "Đã chạy tiền thật (lệnh thật đầu tiên được đối chiếu)"}
    - {date: 2026-10-03, kind: change, text: "Đổi thông số: bỏ các ngày lễ Nhật không chốt tỷ giá"}
    - {date: 2026-10-05, kind: find, text: "Kiểm thêm trên dữ liệu 2004–2015: vẫn lãi"}
    - {date: 2026-10-06, kind: change, text: "Đổi cách đặt lệnh: lệnh bán lúc chốt tỷ giá gửi sớm hơn, thử lại nhanh khi lỗi"}
    - {date: 2026-10-15, kind: change, text: "Đổi thông số: gửi mức cắt lỗ thật lên sàn"}
  note: "Đây là thuật toán duy nhất đạt luật lên tiền thật; ECB F3 chạy tiền thật 0,01 lot chỉ để đo giá khớp."

